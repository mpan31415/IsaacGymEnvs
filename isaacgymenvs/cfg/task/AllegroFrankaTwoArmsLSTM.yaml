defaults:
  - AllegroFrankaLSTM
  - _self_

name: AllegroFrankaTwoArms

env:
  numArms: 2

  envSpacing: 1.75

  # two arms essentially need to throw the object to each other
  # training is much harder with random forces, so we disable it here as we do for the throw task
  # forceScale: 0.0

  tablePoseXOfs: 1.0
  tablePoseYOfs: 0.0
  tablePoseZOfs: 0.45

  # EXTRAS : USEFUL FOR DEBUGGING WITH LOW COMPUTE
  
  # number of environments
  # numEnvs: 4
  
  # controls the number of objects generated in the temp directory
  randomizeObjectDimensions: True
  # withSmallCuboids: False
  withBigCuboids: True         # 7x7x7 = 343 objects
  # withSticks: False

